[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[project]
name = "kassandra"
version = "0.1.0"
description = "Corporate early-warning and dependency-intelligence system"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "httpx>=0.27.0",
    "feedparser>=6.0.0",
    "lxml>=5.0.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "itsdangerous>=2.0.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.27.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]
handelsregister = [
    "mechanize>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[project.scripts]
kassandra = "kassandra.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
